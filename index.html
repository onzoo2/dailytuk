<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매일툭챌린지</title>
<meta name="description" content="각자의 목표만큼, 꾸준히 툭. 콘텐츠 발행 챌린지">
<meta name="theme-color" content="#FBF7F2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#FBF7F2; --card:#FFFFFF; --ink:#352F2B; --muted:#8F857D; --line:#ECE4DB;
    --peach:#F5BFA0; --peach-soft:#FCEBDF; --sage:#C3DBC5; --sage-soft:#EEF5EE; --sage-ink:#4E7355;
    --r:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.5;word-break:keep-all;padding:0 16px calc(96px + env(safe-area-inset-bottom));}
  main{max-width:480px;margin:0 auto}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none;text-align:inherit}
  a{color:inherit}
  .num{font-variant-numeric:tabular-nums}

  header{padding:26px 4px 16px}
  .brand{font-size:13px;font-weight:600;color:var(--muted)}
  .title{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.25;margin-top:4px}
  .sub{font-size:14px;color:var(--muted);margin-top:2px}
  .track{height:6px;border-radius:99px;background:var(--line);margin-top:12px;overflow:hidden}
  .track i{display:block;height:100%;border-radius:99px;background:var(--peach);transition:width .6s ease}
  .demo{display:inline-block;margin-top:10px;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--peach-soft)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
  .panel h2{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .panel h2 small{font-size:12px;font-weight:500;color:var(--muted)}
  .field{width:100%;height:50px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--bg);font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
  .field:focus{border-color:var(--peach);background:#fff}
  .row2{display:flex;gap:8px;margin-top:8px}
  .row2 > *{flex:1;min-width:0}
  .btn{display:block;width:100%;height:54px;border-radius:14px;background:var(--ink);color:#fff;font-size:16px;font-weight:700;margin-top:10px;text-align:center;transition:transform .08s}
  .btn:active{transform:scale(.985)}
  .btn[disabled]{background:var(--line);color:var(--muted);cursor:default}
  .btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line);height:44px;font-size:14px;font-weight:600}
  .btn.sm{height:40px;font-size:14px;margin-top:8px}
  .link{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px 2px}
  .hint{font-size:13px;color:var(--muted);margin-top:8px}
  .label{font-size:13px;color:var(--muted);margin:14px 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{height:38px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:600;text-align:center}
  .chip[aria-pressed="true"]{background:var(--peach);border-color:var(--peach)}
  .chips.goal .chip{flex:1;border-radius:12px;height:44px;padding:0}
  .ok{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--sage-ink);background:var(--sage-soft);border-radius:12px;padding:10px 12px;margin-bottom:10px}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px}
  .stat small{display:block;font-size:12px;color:var(--muted)}
  .stat b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
  .banner{background:var(--sage-soft);color:var(--sage-ink);border-radius:var(--r);padding:16px;text-align:center;font-size:18px;font-weight:800;margin-bottom:12px}

  .tabs{display:flex;gap:6px;margin:4px 0 10px}
  .tab{flex:1;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;text-align:center;color:var(--muted)}
  .tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .tab small{display:block;font-size:10px;font-weight:500;line-height:1}
  .sec{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 8px}
  .sec h2{font-size:16px;font-weight:700}
  .sec span{font-size:13px;color:var(--muted)}

  .prow{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:8px}
  .prow.me{border:2px solid var(--peach)}
  .r1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .r1 b{font-size:16px;font-weight:700}
  .tag{font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;background:var(--peach)}
  .tag.t{background:var(--bg);border:1px solid var(--line);font-weight:600}
  .tag.rally{background:var(--sage-soft);color:var(--sage-ink)}
  .tag.rally.hot{background:var(--sage);color:var(--ink)}
  .tag.soft{background:var(--bg);color:var(--muted);font-weight:500}
  .r1 .cnt{margin-left:auto;font-size:14px;font-weight:700}
  .r2{font-size:12px;color:var(--muted);margin-top:2px}
  .segs{display:flex;gap:4px;margin-top:10px}
  .segs i{flex:1;height:8px;border-radius:99px;background:var(--line)}
  .segs i.on{background:var(--peach)}
  .segs.done i.on{background:var(--sage)}

  .feed{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px}
  .fitem{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .fitem:last-child{border-bottom:0}
  .fitem .who{flex:1;min-width:0}
  .fitem .who b{font-size:14px}
  .fitem .who span{font-size:12px;color:var(--muted)}
  .fitem .who a{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-underline-offset:3px}
  .cheer{flex:none;height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600}
  .cheer[aria-pressed="true"]{background:var(--peach);border-color:var(--peach)}
  .cheer.mine{border:0;background:none;color:var(--muted);cursor:default}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:22px 0}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-weight:500;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
  td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  tr:last-child td{border-bottom:0}
  .total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-size:14px}
  .total b{font-size:20px;font-weight:800}
  details summary{cursor:pointer;font-size:15px;font-weight:700;list-style:none;display:flex;justify-content:space-between}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:"＋";color:var(--muted);font-weight:400}
  details[open] summary::after{content:"－"}
  details[open] summary{margin-bottom:10px}

  /* 프로필 */
  .phead{display:flex;gap:14px;align-items:center}
  .lv{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;text-align:center;line-height:1.15;border:2px solid var(--ink);background:#fff}
  .lv.l1{background:var(--peach-soft)} .lv.l2{background:var(--peach)} .lv.l3{background:var(--sage)}
  .lv.l4{background:var(--ink);color:var(--peach)} .lv.l5{background:linear-gradient(135deg,var(--peach),var(--sage))}
  .panel.th4{background:var(--peach-soft);border-color:var(--peach)}
  .panel.th5{background:linear-gradient(160deg,var(--peach-soft),var(--sage-soft));border-color:var(--sage)}
  .phead h1{font-size:20px;font-weight:800}
  .phead p{font-size:13px;color:var(--muted)}
  .strip{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0}
  .strip b{width:28px}
  .strip .dots{letter-spacing:3px;font-size:15px}
  .strip span{color:var(--muted);font-size:12px}
  .pitem{padding:12px 0;border-bottom:1px solid var(--line)}
  .pitem:last-child{border-bottom:0}
  .pitem .l1{display:flex;gap:8px;align-items:center;font-size:14px}
  .pitem .l1 .d{flex:none;width:42px;font-size:12px;color:var(--muted)}
  .pitem .l1 a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-underline-offset:3px}
  .pitem .l2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0 0 50px;font-size:12px;color:var(--muted)}

  .wkbox{border-top:1px solid var(--line);padding:14px 0}
  .wkbox:first-of-type{border-top:0;padding-top:0}
  .wkbox h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between}
  .wkbox h3 span{font-size:12px;font-weight:500;color:var(--muted)}
  .pline{border-top:1px solid var(--line);padding:12px 0}
  .pline:first-of-type{border-top:0}
  .pline .acts{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
  input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}

  footer{text-align:center;font-size:13px;color:var(--muted);padding:22px 0 0}
  .toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:448px;margin:0 auto;background:var(--ink);color:#fff;
    border-radius:14px;padding:14px 16px;font-size:14px;box-shadow:0 8px 28px rgba(53,47,43,.25);z-index:20}
  .overlay{position:fixed;inset:0;background:rgba(53,47,43,.45);display:grid;place-items:center;padding:24px;z-index:30}
  .overlay .box{background:var(--card);border-radius:24px;padding:28px 22px;max-width:340px;width:100%;text-align:center}
  .overlay .lv{margin:0 auto 14px;width:88px;height:88px;font-size:13px}
  .overlay h2{font-size:20px;font-weight:800}
  .overlay p{font-size:14px;color:var(--muted);margin-top:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ── 캐릭터 · 컬러 테마 ── */
  :root{ --bg:#FAF6EF; --ink:#27221F; --muted:#857B73;
    --c0:#FF7A59; --c1:#FFA630; --c2:#FFD23F; --c3:#5CC98B; --c4:#3EC6C0; --c5:#6CA8FF; --c6:#A88BFF; --c7:#FF8FC2; --c8:#D9B48F; }
  .av{display:block;flex:none;width:44px;height:44px}
  .title{font-size:28px}
  .track i{background:var(--ink)}
  .panel{border-radius:22px}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .ok{background:var(--c3);color:var(--ink)}
  .hero{display:flex;justify-content:center;margin:-2px 0 14px}
  .hero .av{width:64px;height:64px;margin:0 -7px}
  .hero .av:nth-child(odd){transform:translateY(8px) rotate(-6deg)}
  .hero .av:nth-child(even){transform:rotate(7deg)}
  .hi{display:flex;align-items:center;gap:10px;min-width:0}
  .hi .av{width:40px;height:40px}
  .stat{border:0;border-radius:22px}
  .stat small{color:rgba(39,34,31,.72)}
  .stat.s0{background:var(--c2)} .stat.s1{background:var(--c7)} .stat.s2{background:var(--c4)} .stat.s3{background:var(--c6)}
  .banner{background:var(--c3);color:var(--ink);border-radius:22px}
  .tab{border-radius:99px}
  .prow{position:relative;overflow:hidden;border:0;border-radius:22px;padding:16px 104px 16px 18px;min-height:112px}
  .prow.me{border:0;box-shadow:0 0 0 3px var(--ink)}
  .prow .av{position:absolute;right:-8px;bottom:-18px;width:112px;height:112px}
  .prow .r1 b{font-size:18px;font-weight:800}
  .prow .r2{color:rgba(39,34,31,.72)}
  .prow .tag,.prow .tag.rally,.prow .tag.t,.prow .tag.soft{background:rgba(255,255,255,.6);color:var(--ink);border:0}
  .prow .tag.mine{background:var(--ink);color:#fff}
  .prow .tag.rally.hot{background:var(--ink);color:#fff}
  .prow .cnt{display:block;margin:6px 0 0;font-size:22px;font-weight:800;letter-spacing:-.02em}
  .prow .segs{margin-top:6px}
  .segs i{background:rgba(255,255,255,.6)}
  .segs i.on,.segs.done i.on{background:var(--ink)}
  .fitem .av{width:40px;height:40px}
  .cheer[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .pcard{position:relative;overflow:hidden;border-radius:22px;padding:20px 18px 18px;margin-bottom:12px;min-height:150px}
  .pcard .av{position:absolute;right:-14px;bottom:-22px;width:150px;height:150px}
  .pcard h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .pcard p{font-size:13px;color:rgba(39,34,31,.75);max-width:62%}
  .pcard .tag{display:inline-block;background:var(--ink);color:#fff;font-size:12px;padding:3px 10px;margin-bottom:6px}
  .pcard .link{color:var(--ink);display:inline-block;margin-top:6px}
  .tiles{display:flex;gap:5px}
  .tiles .av{width:34px;height:34px}
  .tiles i{width:34px;height:34px;border-radius:10px;border:1.5px dashed var(--line)}
  .strip{gap:12px}
  .pick .pv{display:grid;place-items:center;padding:6px 0 12px}
  .pick .pv .av{width:112px;height:112px}
  .pick .shapes{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
  .pick .shapes button{padding:3px;border-radius:12px;border:2px solid transparent}
  .pick .shapes button[aria-pressed="true"]{border-color:var(--ink)}
  .pick .shapes .av{width:100%;height:auto}
  .pick .cols{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:10px}
  .pick .cols button{aspect-ratio:1;border-radius:50%;border:3px solid transparent}
  .pick .cols button[aria-pressed="true"]{border-color:var(--ink)}
  .overlay{padding:0}
  .overlay .box{background:none;max-width:none;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;border-radius:0}
  .overlay .av{width:220px;height:220px;margin:0 0 8px}
  .overlay h2{font-size:34px;font-weight:800;letter-spacing:-.03em}
  .overlay p{color:var(--ink);font-size:15px;max-width:280px}
  .overlay .btn{max-width:320px;margin-top:26px}
  .ti{flex:none;width:34px;height:34px;padding:7px;border-radius:10px;background:var(--bg);color:var(--ink)}
  .pitem .l1 .d{width:38px}
  .pitem .l2{margin-left:42px}
  .stat.sp{background:var(--card);border:1px solid var(--line)}
  .stat.sp small{color:var(--muted)}
  .pcard{min-height:132px}
</style>
</head>
<body>
<main id="app"><p class="empty">불러오는 중…</p></main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';

/* ───────── 설정과 상수 ───────── */
var CFG = window.CHALLENGE_CONFIG || {};
var LIVE = !!(CFG.url && CFG.anonKey && window.supabase && window.supabase.createClient);
var db = null;
try { if (LIVE) db = window.supabase.createClient(CFG.url, CFG.anonKey); } catch(e){ LIVE = false; }
var STORE = 'maeiltuk.session';
var TYPES = { instagram_reels:'인스타 릴스', instagram_post:'인스타 게시물', threads:'스레드', youtube_long:'유튜브',
  youtube_shorts:'유튜브 쇼츠', newsletter:'뉴스레터', blog:'블로그', brunch:'브런치', other:'기타' };
var TYPE_KEYS = Object.keys(TYPES);
var LEVELS = [ {n:'Starter',at:0}, {n:'First Tuk',at:1}, {n:'Warm-up',at:10}, {n:'Publisher',at:20}, {n:'Builder',at:60}, {n:'Creator',at:120} ];
var DEMO_MSG = '데모 모드에서는 저장되지 않아요. config.js에 키를 넣으면 실제로 동작해요.';

/* 캐릭터: '도형-색' (예: '3-5'). 표정은 진행 상태에 따라 바뀐다 */
var COLORS = ['#FF7A59','#FFA630','#FFD23F','#5CC98B','#3EC6C0','#6CA8FF','#A88BFF','#FF8FC2','#D9B48F'];
var COLOR_NAMES = ['코랄','오렌지','옐로','그린','민트','블루','퍼플','핑크','샌드'];
var SHAPES = [
  ['<circle cx="50" cy="50" r="42"/>', 50],
  ['<rect x="12" y="12" width="76" height="76" rx="16"/>', 50],
  ['<path d="M50 14 90 84H10Z"/>', 64],
  ['<path d="M50 10 90 40 75 88H25L10 40Z"/>', 54],
  ['<circle cx="33" cy="58" r="23"/><circle cx="64" cy="60" r="25"/><circle cx="50" cy="36" r="23"/><rect x="33" y="58" width="31" height="23"/>', 56],
  ['<path d="M10 88V50a40 40 0 0 1 80 0v38Z"/>', 52],
  ['<path d="M50 8 92 50 50 92 8 50Z"/>', 50],
  ['<circle cx="50" cy="30" r="22"/><circle cx="70" cy="50" r="22"/><circle cx="50" cy="70" r="22"/><circle cx="30" cy="50" r="22"/>', 50],
  ['<path d="M50 8 88 29V71L50 92 12 71V29Z"/>', 50]
];
function defAv(id){ var h = 0, t = String(id || ''); for (var i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0; return (h % 9) + '-' + (Math.floor(h / 9) % 9); }
function avOf(p){ return p && /^[0-8]-[0-8]$/.test(p.avatar || '') ? p.avatar : defAv(p && p.id); }
function colorOf(p){ return COLORS[Number(avOf(p).split('-')[1])]; }
function tintOf(p){ var c = colorOf(p), o = '#';                       // 색 카드 위에서는 캐릭터를 밝은 톤으로
  for (var i = 1; i < 7; i += 2){ var v = parseInt(c.substr(i, 2), 16); o += ('0' + Math.round(v + (255 - v) * 0.6).toString(16)).slice(-2); } return o; }
function avatar(av, mood, fill){
  var a = String(av || '0-0').split('-'), sh = SHAPES[Number(a[0])] || SHAPES[0], col = fill || COLORS[Number(a[1])] || COLORS[0];
  var y = sh[1], ey = y - 4, my = y + 11, ink = '#27221F', f = '';
  var line = ' fill="none" stroke="' + ink + '" stroke-width="3.2" stroke-linecap="round"';
  if (mood === 'sleepy'){
    f = '<path d="M31 ' + ey + 'Q37 ' + (ey + 5) + ' 43 ' + ey + 'M57 ' + ey + 'Q63 ' + (ey + 5) + ' 69 ' + ey + 'M46 ' + (my + 1) + 'h8"' + line + '/>' +
        '<text x="74" y="' + (y - 20) + '" font-size="13" font-weight="800" fill="' + ink + '" opacity=".55">z</text>';
  } else if (mood === 'happy'){
    f = '<path d="M31 ' + (ey + 2) + 'Q37 ' + (ey - 6) + ' 43 ' + (ey + 2) + 'M57 ' + (ey + 2) + 'Q63 ' + (ey - 6) + ' 69 ' + (ey + 2) + '"' + line + '/>' +
        '<path d="M41 ' + (my - 2) + 'Q50 ' + (my + 12) + ' 59 ' + (my - 2) + 'Z" fill="' + ink + '" stroke="' + ink + '" stroke-width="2.4" stroke-linejoin="round"/>';
  } else {
    f = '<circle cx="37" cy="' + ey + '" r="8" fill="#fff"/><circle cx="63" cy="' + ey + '" r="8" fill="#fff"/>' +
        '<circle cx="38.5" cy="' + (ey + 1) + '" r="3.8" fill="' + ink + '"/><circle cx="64.5" cy="' + (ey + 1) + '" r="3.8" fill="' + ink + '"/>' +
        '<path d="M44 ' + my + 'Q50 ' + (my + 5) + ' 56 ' + my + '"' + line + '/>';
  }
  return '<svg class="av" viewBox="0 0 100 100" aria-hidden="true"><g fill="' + col + '" stroke="' + col + '" stroke-width="8" stroke-linejoin="round">' + sh[0] + '</g>' + f + '</svg>';
}
function picker(){

function ctx(){

  function weekEnd(w){ return (s + w * 7) * 864e5 - 9 * 3600e3; }             // 토요일 24:00 KST
  function open(w){ return w >= 1 && w <= weeks && t >= s + (w - 1) * 7 && now < deadline(w); }
  var minOpen = null;
  for (var w = 1; w <= weeks; w++) if (open(w)){ minOpen = w; break; }
  return { se:se, s:s, e:e, t:t, weeks:weeks, idx:idx, phase:phase, cur:cur, now:now, deadline:deadline, weekEnd:weekEnd, open:open,
    minDate: minOpen ? dstr(s + (minOpen - 1) * 7) : null, per:function(goal){ return se.weekly_deposit / goal; } };
}

function csv(){
  var A = ui.AD, se = A.season, rows = {}, order = [];
  A.weeks.forEach(function(w){ w.lines.forEach(function(l){
    if (!rows[l.eid]){ rows[l.eid] = { name:l.name, goal:l.goal, d:[], r:0, sum:0 }; order.push(l.eid); }
    rows[l.eid].d[w.week - 1] = w.final ? l.deduction : '미확정';
    if (w.final){ rows[l.eid].sum += l.deduction; rows[l.eid].r += l.reward; }
  }); });
  var head = ['이름', '주간 목표'].concat(A.weeks.map(function(w){ return w.week + '주 차감'; })).concat(['차감 합계', '환급액', '리워드 합계(별도 송금)']);
  var lines = [head].concat(order.map(function(k){ var x = rows[k];
    return [x.name, x.goal].concat(A.weeks.map(function(w, i){ return x.d[i] == null ? '' : x.d[i]; })).concat([x.sum, se.weekly_deposit * A.weeks.length - x.sum, x.r]); }));
  var text = '﻿' + lines.map(function(r){ return r.map(function(v){ return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:'text/csv;charset=utf-8' }));
  a.download = 'maeiltuk-' + se.number + '기-환급.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

    if (view.name === 'admin') ui.AD = await rpc('admin_data', { p_token: token, p_season_id: ui.aSeason });
  } catch(e){
    if (!S) ui.loadError = e.message + ' 화면을 새로고침해 보세요.'; else toast(e.message);
  }
  render();
}
async function run(fn){
  if (busy) return; busy = true; toast('');
  try { await fn(); } catch(e){ toast(e.message || friendly('')); }
  busy = false; await load();
}
function route(){
  var h = location.hash.replace(/^#/, '');
  ui.edit = null; ui.fType = null;
  if (h.indexOf('p/') === 0){ view = { name:'profile', id:h.slice(2) }; ui.prof = null; ui.fSeason = 'all'; }
  else if (h === 'admin'){ view = { name:'admin' }; }
  else view = { name:'home' };
  window.scrollTo(0, 0); render(); load();
}
function go(h){ if (location.hash.replace(/^#/, '') === h) route(); else location.hash = h; }

/* ───────── 동작 ───────── */
document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-act]'); if (!b) return;
  var a = b.dataset.act, id = b.dataset.id;
  if (b.dataset.confirm && b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = b.dataset.confirm; return; }
  if (b.tagName === 'INPUT') return;                       // 체크박스는 change에서 처리

  if (a === 'toast'){ toast(''); render(); }
  else if (a === 'levelok'){ ui.levelUp = null; render(); }
  else if (a === 'home') go('');
  else if (a === 'go-admin') go('admin');
  else if (a === 'profile') go('p/' + id);
  else if (a === 'week'){ ui.week = Number(b.dataset.w); render(); }

  /* 로그인 */
  else if (a === 'l-next') run(async function(){
    var n = val('lname'); if (!n) throw new Error('이름을 적어 주세요.');
    var st = await rpc('name_status', { p_name:n });
    ui.loginName = n; ui.step = st === 'pin' ? 'pin' : (st === 'reset' ? 'reset' : 'new');
  });
  else if (a === 'l-back'){ ui.step = 'name'; render(); }
  else if (a === 'l-go') run(async function(){
    var p1 = val('pin1');
    if (!/^\d{4}$/.test(p1)) throw new Error('PIN은 숫자 4자리로 입력해 주세요.');
    if (ui.step !== 'pin' && p1 !== val('pin2')) throw new Error('두 PIN이 서로 달라요. 다시 입력해 주세요.');
    var r = ui.step === 'new' ? await rpc('register', { p_name:ui.loginName, p_pin:p1 }) : await rpc('login', { p_name:ui.loginName, p_pin:p1 });
    if (r && r.error) throw new Error(r.error);
    setToken(r.token); ui.step = 'name'; ui.picked = false;
    toast(r.name + ' 님, 반가워요.');
  });
  else if (a === 'logout') run(async function(){
    var t = token; setToken(null); ui.step = 'name'; ui.picked = false; ui.editEnroll = false;
    if (view.name === 'admin') location.hash = '';
    try { await rpc('logout', { p_token:t }); } catch(e){}
  });

  /* 시즌 참가 설정 */
  else if (a === 'e-type'){ ui.types[b.dataset.k] = !ui.types[b.dataset.k]; render(); }
  else if (a === 'e-goal'){ ui.goal = Number(b.dataset.g); render(); }
  else if (a === 'e-edit'){ ui.editEnroll = true; ui.picked = false; render(); }
  else if (a === 'e-cancel'){ ui.editEnroll = false; render(); }
  else if (a === 'e-save') run(async function(){
    var types = TYPE_KEYS.filter(function(k){ return ui.types[k]; });
    if (!types.length) throw new Error('목표 콘텐츠 유형을 하나 이상 골라 주세요.');
    if (ui.av && ui.av !== S.me.avatar) await rpc('set_avatar', { p_token:token, p_avatar:ui.av });
    await rpc('enroll', { p_token:token, p_goal_types:types, p_weekly_goal:ui.goal, p_main_channel_url:val('ech') || null });
    ui.editEnroll = false; toast('목표를 정했어요. 주 ' + ui.goal + '회, 같이 가요.');
  });

  /* 캐릭터 */
  else if (a === 'av-s'){ ui.av = b.dataset.i + '-' + ui.av.split('-')[1]; render(); }
  else if (a === 'av-c'){ ui.av = ui.av.split('-')[0] + '-' + b.dataset.i; render(); }
  else if (a === 'av-edit'){ ui.avEdit = true; ui.av = avOf(S.me); render(); }
  else if (a === 'av-cancel'){ ui.avEdit = false; render(); }
  else if (a === 'av-save') run(async function(){
    await rpc('set_avatar', { p_token:token, p_avatar:ui.av }); ui.avEdit = false; toast('캐릭터를 바꿨어요.');
  });

  /* 발행 인증 */
  else if (a === 'p-add') run(async function(){
    var url = val('purl'); if (!url) throw new Error('발행한 콘텐츠의 링크를 붙여넣어 주세요.');
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    var r = await rpc('add_post', { p_token:token, p_url:url, p_published_on:val('pon') || null, p_content_type:null });
    $('purl').value = '';
    toast(r.counts ? '툭. ' + r.week + '주차 ' + r.week_count + '/' + r.goal + ' · ' + (TYPES[r.type] || '') : '발행 기록에 추가됐어요 (' + (TYPES[r.type] || '') + ' · 챌린지 목표 외). 유형이 다르면 내 기록에서 고칠 수 있어요.');
    if (r.level_up) ui.levelUp = r.level;
  });
  else if (a === 'cheer') run(async function(){
    if (!token) throw new Error('응원하려면 먼저 이름으로 로그인해 주세요.');
    await rpc('toggle_cheer', { p_token:token, p_post_id:Number(id) });
  });

  /* 내 기록 수정·삭제 (운영자는 모두) */
  else if (a === 'f-type'){ ui.fType = ui.fType === b.dataset.k ? null : b.dataset.k; render(); }
  else if (a === 'x-edit'){ ui.edit = Number(id); render(); }
  else if (a === 'x-cancel'){ ui.edit = null; render(); }
  else if (a === 'x-save') run(async function(){
    var mine = S.me && ui.prof && S.me.id === ui.prof.id;
    if (mine) await rpc('update_post', { p_token:token, p_post_id:Number(id), p_published_on:val('xon') || null, p_content_type:val('xtype') });
    else await rpc('admin_put_post', { p_token:token, p_participant:ui.prof.id, p_post_id:Number(id), p_published_on:val('xon') || null, p_content_type:val('xtype') });
    ui.edit = null; toast('수정했어요.');
  });
  else if (a === 'x-del') run(async function(){
    var mine = S.me && ui.prof && S.me.id === ui.prof.id;
    await rpc(mine ? 'delete_post' : 'admin_delete_post', { p_token:token, p_post_id:Number(id) });
    toast('삭제했어요.');
  });

  /* 운영자 */
  else if (a === 'a-season') run(async function(){
    await rpc('admin_create_season', { p_token:token, p_number:Number(val('snum')) || null, p_starts_on:val('sstart') || null, p_ends_on:val('send') || null });
    toast('시즌을 만들었어요.');
  });
  else if (a === 'a-final') run(async function(){ await rpc('admin_finalize', { p_token:token, p_season_id:ui.AD.season.id, p_week_no:Number(b.dataset.w) }); toast(b.dataset.w + '주차 정산을 확정했어요.'); });
  else if (a === 'a-unfinal') run(async function(){ await rpc('admin_unfinalize', { p_token:token, p_season_id:ui.AD.season.id, p_week_no:Number(b.dataset.w) }); toast('확정을 풀었어요. 현재 인증 기준으로 다시 계산돼요.'); });
  else if (a === 'a-csv') csv();
  else if (a === 'a-open'){
    var same = ui.aOpen && ui.aOpen.id === id && ui.aOpen.mode === b.dataset.m;
    ui.aOpen = same ? null : { id:id, mode:b.dataset.m };
    if (!same && b.dataset.m === 'enroll'){
      var p = ui.AD.participants.filter(function(x){ return x.id === id; })[0];
      ui.aTypes = {}; ui.aGoal = p && p.e ? p.e.goal : 3;
      if (p && p.e) p.e.types.forEach(function(k){ ui.aTypes[k] = true; });
    }
    render();
  }
  else if (a === 'a-type'){ ui.aTypes[b.dataset.k] = !ui.aTypes[b.dataset.k]; render(); }
  else if (a === 'a-goal'){ ui.aGoal = Number(b.dataset.g); render(); }
  else if (a === 'a-enroll') run(async function(){
    var types = TYPE_KEYS.filter(function(k){ return ui.aTypes[k]; });
    if (!types.length) throw new Error('목표 유형을 하나 이상 골라 주세요.');
    await rpc('admin_set_enrollment', { p_token:token, p_participant:id, p_season_id:ui.AD.season.id, p_goal_types:types, p_weekly_goal:ui.aGoal, p_main_channel_url:val('ach') || null });
    ui.aOpen = null; toast('참가 설정을 저장했어요.');
  });
  else if (a === 'a-post') run(async function(){
    var url = val('aurl'); if (!url) throw new Error('콘텐츠 링크를 넣어 주세요.');
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    await rpc('admin_put_post', { p_token:token, p_participant:id, p_post_id:null, p_url:url, p_published_on:val('aon') || null, p_content_type:val('atype') || null });
    $('aurl').value = ''; toast('인증을 추가했어요.');
  });
  else if (a === 'a-pin') run(async function(){ await rpc('admin_reset_pin', { p_token:token, p_participant:id }); toast('PIN을 초기화했어요. 다음 로그인 때 새로 정하게 돼요.'); });
  else if (a === 'a-remove') run(async function(){ await rpc('admin_remove_participant', { p_token:token, p_participant:id }); toast('참가자를 삭제했어요.'); });
});

document.addEventListener('change', function(ev){
  var el = ev.target;
  if (el.id === 'fseason'){ ui.fSeason = el.value; ui.fType = null; render(); }
  else if (el.id === 'aseason'){ ui.aSeason = Number(el.value); ui.aOpen = null; load(); }
  else if (el.dataset && el.dataset.act === 'a-paid') run(async function(){
    await rpc('admin_set_paid', { p_token:token, p_season_id:ui.AD.season.id, p_week_no:Number(el.dataset.w), p_enrollment_id:Number(el.dataset.e), p_paid:el.checked });
  });
});
document.addEventListener('input', function(ev){
  var el = ev.target;
  if (el.id === 'purl') syncAuto();
  if (el.id === 'aurl' && $('atype')) $('atype').value = classify(el.value);
});
document.addEventListener('keydown', function(ev){
  if (ev.key !== 'Enter') return;
  var map = { lname:'l-next', pin1:'l-go', pin2:'l-go', purl:'p-add' }, a = map[ev.target.id];
  if (a === 'l-go' && ev.target.id === 'pin1' && $('pin2')){ $('pin2').focus(); return; }
  if (a){ var b = document.querySelector('[data-act="' + a + '"]'); if (b) b.click(); }
});
document.addEventListener('visibilitychange', function(){ if (!document.hidden && S && !busy) load(); });
window.addEventListener('hashchange', route);

token = getToken();
route();
})();
</script>
</body>
</html>
